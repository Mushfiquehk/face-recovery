[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-pipeline"
version = "0.1.0"
description = "Research strand: pair Face Scan photos with WHOOP Recovery"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "pillow-heif>=0.16",  # iPhone photos are HEIC
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26"]
research = ["numpy>=1.26"]  # face-pipeline research; also needs Xcode's swift for Apple Vision

[project.scripts]
face-pipeline = "face_pipeline.cli:main"

[tool.setuptools]
packages = ["face_pipeline"]

[tool.setuptools.package-data]
face_pipeline = ["measure/*.swift"]
